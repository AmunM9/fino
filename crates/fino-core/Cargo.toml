[package]
name = "fino-core"
version = "0.1.0"
edition = "2021"

[dependencies]
fast_image_resize = "6.1.0"
filetime = "0.2.29"
img-parts = "0.4.0"
imgref = "1"
libc = "0.2.190"
memchr = "2"
mozjpeg = "0.10.13"
mozjpeg-sys = { version = "2", default-features = false, features = ["unwinding"] }
rayon = "1.12"
regex = "1"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2"
zensim = "0.2.7"
zune-jpeg = "0.5.15"

[dev-dependencies]
fast-ssim2 = { version = "0.8.2", features = ["imgref"] }
tempfile = "3.27.0"

# Extended attributes (Finder tags, colour labels) travel with optimized photos.
[target.'cfg(unix)'.dependencies]
xattr = "1.6.1"

# Installed memory, to bound how many photos are in flight.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_SystemInformation"] }

# HEIC decoding through the system's ImageIO (no bundled HEVC codec).
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFBase", "CFData", "CFDictionary", "CFString", "CFNumber", "CFCGTypes"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGImage", "CGColorSpace", "CGContext", "CGBitmapContext", "CGDataProvider"] }
objc2-image-io = { version = "0.3.2", default-features = false, features = ["std", "CGImageSource", "CGImageProperties", "CGImageDestination", "CGImageMetadata", "objc2-core-graphics"] }
