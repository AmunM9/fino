name: Release

# Pushing a version tag (v0.2.0) builds both installers and publishes them as a GitHub release.
# Running it by hand builds the installers as downloadable artifacts without publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
            bundle: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - name: Windows
            os: windows-latest
            targets: ""
            args: ""
            bundle: target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the app version $version (src-tauri/tauri.conf.json)"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
      # libjpeg's x86 SIMD is assembled with NASM.
      - uses: ilammy/setup-nasm@v1
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tauri build ${{ matrix.args }}
      # Unsigned, but Apple Silicon refuses to open an app without at least an ad-hoc signature.
      - name: App is ad-hoc signed
        if: runner.os == 'macOS'
        run: codesign --verify --deep --strict --verbose=2 target/universal-apple-darwin/release/bundle/macos/Fino.app
      - uses: actions/upload-artifact@v7
        with:
          name: fino-${{ matrix.name }}
          path: ${{ matrix.bundle }}
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          sed "s/x\.y\.z/$version/g" .github/release-notes.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "Fino $version" \
            --notes-file notes.md \
            --generate-notes
