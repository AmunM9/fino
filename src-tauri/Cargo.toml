[package]
name = "fino"
version = "0.1.0"
description = "Fino — smaller photos that look exactly the same"
authors = ["Manuel Torres"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "fino_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Not `fino`: the CLI owns that name, and two binaries with one name collide in the shared
# target directory (fatally on Windows, where both write `fino.pdb`). The bundled app is
# still called Fino (`mainBinaryName` in tauri.conf.json).
[[bin]]
name = "fino-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fino-core = { version = "0.1.0", path = "../crates/fino-core" }
rayon = "1.12"
tauri-plugin-dialog = "2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
# The OS's preferred languages (macOS per-app choice included), for the UI language.
sys-locale = "0.3.2"

[dev-dependencies]
tempfile = "3.27.0"

# Windows and Linux hand "Open with" files to a new process; it forwards them to the open window.
[target.'cfg(not(target_os = "macos"))'.dependencies]
tauri-plugin-single-instance = "2"

# Native animated window resizing for the mini window (already in the tree through Tauri).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWindow", "NSScreen", "NSResponder"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSGeometry"] }
